name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit + integration tests, Electron E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Legal artifacts are up to date (SBOM, licences, legal website)
        run: |
          node scripts/sbom.mjs --check
          node scripts/build-legal-site.mjs
          git diff --exit-code -- legal apps/admin-server/src/legal-pages.ts || { echo "::error::Run node scripts/sbom.mjs and node scripts/build-legal-site.mjs and commit the result"; exit 1; }
      - name: Dependency vulnerability scan (report)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Electron end-to-end smoke test
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npm run build -w @fristy/desktop
          xvfb-run -a node tests/e2e/electron-smoke.mjs
        env:
          # keep test machines out of the real owner service (and its banners out of the test)
          FRISTY_ADMIN_API_URL: 'off'
      - name: Bundle mobile app (Metro, Android + iOS)
        working-directory: apps/mobile
        run: |
          npx expo export --platform android --output-dir /tmp/mobile-android
          npx expo export --platform ios --output-dir /tmp/mobile-ios

  windows-installer:
    name: Windows installer (NSIS .exe)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # publish the update as a GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version
        shell: bash
        run: npm pkg set version=0.2.${{ github.run_number }} -w @fristy/desktop
      - name: Build installer
        shell: bash
        run: |
          npm run build -w @fristy/desktop
          cd apps/desktop
          npx electron-builder --win --x64 --publish never
        env:
          FRISTY_ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
          # Optional code signing (recommended to avoid SmartScreen warnings):
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Publish the update as a GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=0.2.${{ github.run_number }}
          cd apps/desktop/release
          gh release create "v$V" FRISTY-Remote-Setup-$V.exe* latest.yml \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "FRISTY Remote $V" --notes "Windows installer $V" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: FRISTY-Remote-Setup
          path: apps/desktop/release/FRISTY-Remote-Setup-*.exe
          if-no-files-found: error

  relay-image:
    name: Relay server Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/relay-server/Dockerfile -t fristy-relay:ci .
