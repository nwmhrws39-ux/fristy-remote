name: iOS app (unsigned .ipa)

# Builds an unsigned iPhone app. Install it with Sideloadly or AltStore using a
# free Apple ID (they sign it on your PC). See docs/BUILD_IOS.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Version
        working-directory: apps/mobile
        run: |
          node -e "const f='app.json',j=require('./'+f);j.expo.version='0.2.${{ github.run_number }}';j.expo.ios.buildNumber='${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Generate native iOS project
        working-directory: apps/mobile
        env:
          # Optional owner service (admin panel / app lock). Empty = feature off.
          EXPO_PUBLIC_ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
          EXPO_PUBLIC_RELEASES_REPO: ${{ secrets.RELEASES_TOKEN != '' && format('{0}/fristy-remote-releases', github.repository_owner) || '' }}
        run: npx expo prebuild -p ios --clean

      - name: Remove push-notification entitlement
        # Free Apple IDs cannot sign apps that use remote push. FRISTY Remote only
        # uses local notifications, which keep working without this entitlement.
        working-directory: apps/mobile/ios
        run: |
          for f in */*.entitlements; do
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$f" 2>/dev/null || true
          done

      - name: Build (unsigned)
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
          EXPO_PUBLIC_RELEASES_REPO: ${{ secrets.RELEASES_TOKEN != '' && format('{0}/fristy-remote-releases', github.repository_owner) || '' }}
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "Workspace: $WS  Scheme: $SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FRISTYRemote.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 80

      - name: Package .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R FRISTYRemote.xcarchive/Products/Applications/*.app Payload/
          zip -qry FRISTY-Remote-unsigned.ipa Payload
          ls -lh FRISTY-Remote-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FRISTY-Remote-iOS
          path: ${{ runner.temp }}/FRISTY-Remote-unsigned.ipa
          if-no-files-found: error

      - name: Publish to the releases repository (when configured)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::RELEASES_TOKEN not set – skipping publish (docs/UPDATES.md)"; exit 0; fi
          V=0.2.${{ github.run_number }}
          cp "$RUNNER_TEMP/FRISTY-Remote-unsigned.ipa" "$RUNNER_TEMP/FRISTY-Remote-iOS-$V.ipa"
          gh release create "ios-v$V" "$RUNNER_TEMP/FRISTY-Remote-iOS-$V.ipa" \
            --repo "${{ github.repository_owner }}/fristy-remote-releases" --prerelease \
            --title "FRISTY Remote for iPhone $V" \
            --notes "Install with Sideloadly (see the install guide). Older iPhone versions stop working once this version is out."
